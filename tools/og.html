<!doctype html>
<!-- Modelo da imagem de prévia do link (WhatsApp, redes). Gere com:
     msedge --headless=new --window-size=1200,630 --screenshot=og.png tools/og.html -->
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<style>
  @font-face { font-family: "Jost"; src: url("../assets/fonts/jost-latin.woff2") format("woff2"); font-weight: 200 600; }
  * { box-sizing: border-box; margin: 0; }
  html, body { width: 1200px; height: 630px; overflow: hidden; }
  body { position: relative; background: #131313; color: #f1f0ed; font-family: "Jost", Arial, sans-serif; -webkit-font-smoothing: antialiased; }
  .photo { position: absolute; top: 0; right: 0; bottom: 0; width: 560px; clip-path: polygon(34% 0, 100% 0, 100% 100%, 0 100%); }
  .photo img { width: 100%; height: 100%; object-fit: cover; }
  .inset { position: absolute; right: 360px; bottom: 56px; width: 170px; height: 220px; border: 7px solid #131313; overflow: hidden; }
  .inset img { width: 100%; height: 100%; object-fit: cover; }
  .text { position: absolute; left: 72px; top: 64px; bottom: 64px; width: 560px; display: flex; flex-direction: column; }
  .brand { display: flex; align-items: center; gap: 16px; }
  .brand svg { width: 52px; height: 49px; color: #f1f0ed; }
  .name { font-size: 34px; font-weight: 500; letter-spacing: .1em; line-height: 1; }
  .sub { font-size: 13px; letter-spacing: .5em; text-transform: uppercase; color: rgba(241, 240, 237, .7); margin-top: 8px; }
  h1 { margin-top: auto; font-weight: 300; font-size: 76px; line-height: 1; letter-spacing: -.035em; }
  p { margin-top: 26px; font-size: 24px; line-height: 1.35; color: rgba(241, 240, 237, .72); max-width: 22ch; }
  .tag { margin-top: 30px; display: inline-flex; align-items: center; gap: 12px; font-size: 14px; font-weight: 500; letter-spacing: .2em; text-transform: uppercase; color: rgba(241, 240, 237, .8); }
  .tag::before { content: ""; width: 7px; height: 12px; background: currentColor; clip-path: polygon(0 0, 100% 36%, 100% 100%, 0 64%); }
</style>
</head>
<body>
  <figure class="photo"><img src="../assets/fotos/corporativo/sala-reuniao-1-1200.webp" alt=""></figure>
  <figure class="inset"><img src="../assets/fotos/cozinhas/balcao-ripado-1-480.webp" alt=""></figure>
  <div class="text">
    <div class="brand">
      <svg viewBox="470 200 260 246" aria-hidden="true"><path d="M476 208 600 300 600 385 476 294Z" fill="currentColor" opacity=".74"/><path d="M600 300 672 353 672 440 600 385Z" fill="currentColor"/><path d="M676 222 724 206 724 396 676 362Z" fill="currentColor"/></svg>
      <div><div class="name">N.ART</div><div class="sub">Móveis</div></div>
    </div>
    <h1>Conheça nossos projetos</h1>
    <p>Móveis planejados sob medida em Londrina e região.</p>
    <span class="tag">Mãos que criam, corações que amam</span>
  </div>
</body>
</html>
